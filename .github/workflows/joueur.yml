name: Vivre Card (joueur)

on:
  push:
    branches: [main]
    tags: ['joueur-v*']
    paths:
      - 'apps/joueur/**'
      - 'packages/core/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vitest.config.ts'
      - '.github/workflows/joueur.yml'
  pull_request:
    paths:
      - 'apps/joueur/**'
      - 'packages/core/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/joueur.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Dépendances
        run: npm ci

      - name: Vérification des types et tests (tout le monorepo)
        run: |
          npm run check
          npm test

      - name: Build web + synchro Capacitor
        run: |
          npm run android:joueur
          chmod +x apps/joueur/android/gradlew

      - name: Version depuis le tag
        if: startsWith(github.ref, 'refs/tags/joueur-v')
        run: |
          VERSION="${GITHUB_REF_NAME#joueur-v}"
          IFS=. read -r MAJ MIN PAT <<< "$VERSION"
          echo "VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$(( MAJ * 10000 + MIN * 100 + PAT ))" >> "$GITHUB_ENV"
          APP_VERSION=$(node -p "require('./apps/joueur/package.json').version")
          if [ "$APP_VERSION" != "$VERSION" ]; then
            echo "::error::Le tag ($VERSION) ne correspond pas à apps/joueur/package.json ($APP_VERSION)"; exit 1
          fi

      - name: APK de debug
        if: "!startsWith(github.ref, 'refs/tags/joueur-v')"
        working-directory: apps/joueur/android
        run: ./gradlew assembleDebug

      - name: APK de release signé
        if: startsWith(github.ref, 'refs/tags/joueur-v')
        working-directory: apps/joueur/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 manquant (voir docs/RELEASE.md)"; exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/VivreCard-${GITHUB_REF_NAME#joueur-}.apk"

      - name: Artefact (APK de debug)
        if: "!startsWith(github.ref, 'refs/tags/joueur-v')"
        uses: actions/upload-artifact@v7
        with:
          name: vivrecard-debug-apk
          path: apps/joueur/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publication de la Release
        if: startsWith(github.ref, 'refs/tags/joueur-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/VivreCard-${GITHUB_REF_NAME#joueur-}.apk" \
            --title "Vivre Card ${GITHUB_REF_NAME#joueur-}" --generate-notes
