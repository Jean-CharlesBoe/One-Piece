name: One Piece (MJ)

# Appli MJ = appli web installable (D-M18), publiée sur GitHub Pages.
# Chaque push vérifie et construit ; la publication se fait à la demande (Actions › One Piece (MJ) › Run workflow,
# ou `gh workflow run mj.yml`), pour qu'une version en cours ne remplace jamais l'app du MJ sans qu'il le décide.

on:
  push:
    branches: [main]
    paths:
      - 'apps/mj/**'
      - 'packages/core/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vitest.config.ts'
      - '.github/workflows/mj.yml'
  pull_request:
    paths:
      - 'apps/mj/**'
      - 'packages/core/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/mj.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mj-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Dépendances
        run: npm ci

      - name: Vérification des types et tests (tout le monorepo)
        run: |
          npm run check
          npm test

      - name: Build de l'appli web
        run: npx vite build apps/mj

      - name: Artefact pour GitHub Pages
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/mj/dist

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publication sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
